[package]
name = "model-lens"
version = "0.2.33"
edition = "2021"
rust-version = "1.89"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "=2.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls", "system-proxy"] }

tempfile = "3.27.0"
lmfpd = "=0.2.0"
ruzstd = "0.9.1"
sha2 = "0.10.9"
chrono = { version = "0.4", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-updater = "=2.12.0"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder", "NSApplication"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"
dunce = "1"
tauri-plugin-updater = "=2.12.0"
windows-sys = { version = "0.61", features = [
  "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock",
  "Win32_Security_Authorization", "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects",
  "Win32_System_Threading", "Win32_System_WindowsProgramming",
  "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging",
] }
