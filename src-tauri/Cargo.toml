[package]
name = "model-lens"
version = "0.2.13"
edition = "2021"
rust-version = "1.89"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "=2.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }

tempfile = "3.27.0"
