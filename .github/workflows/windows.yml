name: ModelLens Windows x64

on:
  push:
    branches: [main, codex/windows]
    paths:
      - '.gitattributes'
      - '.github/workflows/windows.yml'
      - 'windows/**'
      - 'src/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'index.html'
  workflow_dispatch:
    inputs:
      verify_update:
        description: 从旧测试版安装服务器上的正式更新
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/windows/target
      CARGO_TERM_COLOR: never
      PYTHONUTF8: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install build tools
        run: |
          npm install --global pnpm@10.10.0
          rustup toolchain install 1.89.0 --profile minimal
          rustup override set 1.89.0
          rustup target add x86_64-pc-windows-msvc
          pnpm install --frozen-lockfile
      - id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            windows/target
          key: windows-x64-rust-1.89-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Build Windows NSIS installer
        if: ${{ !inputs.verify_update }}
        run: node node_modules/@tauri-apps/cli/tauri.js build --ci --target x86_64-pc-windows-msvc --config windows/tauri.conf.json -- --locked
      - name: Run Windows unit tests
        if: ${{ !inputs.verify_update }}
        run: |
          $env:TAURI_CONFIG = Get-Content windows/tauri.conf.json -Raw
          cargo test --locked --release --features tauri/custom-protocol --target x86_64-pc-windows-msvc --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !inputs.verify_update }}
        with:
          name: modellens-windows-x64
          path: windows/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !inputs.verify_update && steps.rust-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            windows/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Install UI test dependency
        run: python -m pip install playwright==1.65.2
      - name: Install and smoke test current version
        if: ${{ !inputs.verify_update }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          python windows/smoke.py "windows/target/x86_64-pc-windows-msvc/release/bundle/nsis/ModelLens_${version}_x64-setup.exe"
      - name: Install an older test version and apply the signed online update
        if: ${{ inputs.verify_update }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force windows/target | Out-Null
          '{"version":"0.0.0"}' | Set-Content windows/target/smoke-version.json -Encoding ascii
          node node_modules/@tauri-apps/cli/tauri.js build --ci --target x86_64-pc-windows-msvc --config windows/tauri.conf.json --config windows/target/smoke-version.json -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python windows/smoke.py "windows/target/x86_64-pc-windows-msvc/release/bundle/nsis/ModelLens_0.0.0_x64-setup.exe" --expect-update $version
